name: Build and publish macOS beta

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the v1.1.107 GitHub release
        type: boolean
        default: false
  push:
    branches:
      - 'codex/macos-beta'
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build universal macOS application and DMG
        env:
          APP_VERSION: 1.1.107
        run: bash macos/build.sh

      - name: Upload macOS build artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorldClockWidget-macOS-v1.1.107
          path: release/WorldClockWidget-macOS-v1.1.107.dmg
          if-no-files-found: error

      - name: Publish cross-platform GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.107
          name: World Clock Widget v1.1.107
          body: |
            Бесплатный MVP-релиз World Clock Widget для Windows и macOS.

            macOS Beta собрана как универсальное приложение для Apple Silicon и Intel (macOS 13+). Пока проект не использует платный Apple Developer ID, при первом запуске откройте «Системные настройки → Конфиденциальность и безопасность» и нажмите «Всё равно открыть». Отключать Gatekeeper или использовать терминал не требуется.
          files: |
            release/WorldClockWidget-macOS-v1.1.107.dmg
          make_latest: true
